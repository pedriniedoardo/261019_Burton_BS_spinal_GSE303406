# ======================================================================
# == cellranger ==
# ======================================================================

INTRON_param: '--include-introns'
INTRON_flag: 'true'
BAM_flag: 'true'

# Chemistry passed to `cellranger count --chemistry=`. Leave empty ("") to let cellranger auto-detect it.
# Set it when auto-detection refuses to run, e.g. 10x Multiome (GEX+ATAC) libraries: cellranger count detects "ARC-v1" and stops with "Cell Ranger detected the chemistry ARC-v1, which may indicate a workflow error". Forcing "ARC-v1" processes the GEX reads of such samples (e.g. GSE189141).
# Other values: SC3Pv3, SC3Pv4, SC5P-R2, SC5PHT, ... (see `cellranger count --help`).
# Default case (standard 10x data, auto-detection): set it to an empty string
#   cellranger_chemistry: ""
# Forcing a chemistry (e.g. Multiome GEX):
#   cellranger_chemistry: "ARC-v1"
cellranger_chemistry: ""

# ======================================================================
# == Dynamic memory allocation ==
# ======================================================================

# memory parameters required for resources assignment
# in "integrateSamples" rule
memory_per_cell: 1        # MB per cell
max_mem_mb: 300000        # MB

# ======================================================================
# == cellbender ==
# ======================================================================

# add flag to run cellbender or not. Set to False to skip cellbender
# run_cellbender: True
run_cellbender: False

# ======================================================================
# == Automatic annotation ==
# ======================================================================

# which automatic annotation method(s) to run and merge into the final annotated object (see rule addAnnotations).
# Any subset/order of: "singleR", "cytetypeR"
# If the list is left empty, no annotation is passed
annotation_methods: ["singleR", "cytetypeR"]

# ======================================================================
# == SingleR annotation (using CELLDEX datasets) ==
# ======================================================================

SingleR_reference: "BlueprintEncodeData"

# CELLDEX DATABASES:

# BlueprintEncodeData ----------------- [Hs]
# normalized expression values of 259 RNA-seq samples of pure stroma and immune cells as 
# generated and supplied by Blueprint and ENCODE

# DatabaseImmuneCellExpressionData ---- [??]
# normalized expression values of 1561 bulk RNA-seq samples of sorted cell populations 
# from the Database of Immune Cell Expression (DICE)

# HumanPrimaryCellAtlasData ----------- [Hs]
# normalized expression values of the data stored in the Human Primary Cell Atlas.

# ImmGenData -------------------------- [Mm]
# normalized expression values of 830 microarray samples of pure mouse immune cells, 
# generated by the Immunologic Genome Project (ImmGen)

# MonacoImmuneData -------------------- [??]
# normalized expression values of 114 bulk RNA-seq samples of sorted immune cell 
# populations that can be found in GSE107011

# MouseRNAseqData --------------------- [Mm]
# normalized expression values of 358 bulk RNA-seq samples of sorted cell populations 
# that can be found at GEO

# NovershternHematopoieticData -------- [Hs]
# normalized expression values of 211 bulk human microarray samples of sorted hematopoietic 
# cell populations that can be found in GSE24759

# ======================================================================
# == CyteTypeR ==
# ======================================================================

# covariate used in the annotation step
cov_markers_CyteTypeR: "RNA_snn_res.0.3"

# ======================================================================
# == Seurat parameters ==
# ======================================================================

Seurat:
  FilterGenes:
    min_fraction_of_cells: 0.01
  NormalizeData:
    normalization.method: "LogNormalize"
    scale.factor: 10000
  FindVariableFeatures:
    selection.method: "vst"
    nfeatures: 2000
  ScaleData:
    vars.to.regress: ['nFeature_RNA', 'percent.mt', 'S.Score', 'G2M.Score'] # null
    scale.max: 10
  RunPCA:
    npcs: 50
  FindNeighbors:
    dims: 30
    k.param: 20
  RunUMAP:
    dims: 30
    n.neighbors: 30
    learning.rate: 1
    min.dist: 0.3
    spread: 1
  FindClusters:
    resolution: [.3, .6, 1, 1.2]
  HarmonyIntegration:
    theta: null # Diversity clustering penalty parameter
    lambda: null # Ridge regression penalty parameter
    sigma: 0.1 # Width of soft kmeans clusters
    max.iter.harmony: 10
  FindAllMarkers:
    logfc.threshold: 0.1
    test.use: "wilcox"
    min.pct: .1
    only.pos: true

# ======================================================================
# == Report ==
# ======================================================================

report:
  author: "Aurora Maurizio - Center for Omics Sciences (COSR)"
  sample_annotations: ['condition', 'time_point']
  figure_extension: ['pdf', 'png']
  report_resolution: .3
  qc_features: [
    'nFeature_RNA',
    'nCount_RNA',
    'percent.mt',
    'percent.ribo',
    'percent.globin',
    'scDblFinder.score'
    ]

