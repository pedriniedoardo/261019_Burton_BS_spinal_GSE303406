# ======================================================================
# == GEO/SRA download (optional pre-processing step) ==
# ======================================================================

# Downloads FASTQs for a GEO Series accession from SRA and writes a samplesheet.csv (sample_name, sample_run, sample_path) compatible with `samples_csv` above.
# Run with: snakemake geo_samplesheet Then point `samples_csv` (above) at the generated <out_location>/geo_download/<gse>/samplesheet.csv and run the pipeline as usual.
# Outputs (including the SRA cache) are written under the top-level `out_location` defined above, so nothing here needs its own out_location/sra_cache path.
geo_download:
  # Accession to download: GEO Series (GSE...), BioProject (PRJNA/PRJEB/PRJDB...) or SRA study (SRP/ERP/DRP...) (the legacy key `gse` is still accepted)
  accession: "GSE158275"
  env_sratools: "../envs/sratools.yaml"
  env_metadata: "../envs/pysradb.yaml"
  # Each SRR's read labels (R1/R2/I1/I2) are checked against the reads: the barcode read (R1)
  # is the file whose reads start with valid 10x barcodes (whitelists of the cellranger10 in env_cellranger).
  read_layout_check:
    n_reads: 10000                # reads sampled per FASTQ
    min_barcode_match: 0.5        # min fraction of reads starting with a valid barcode to call a file R1
    allow_length_fallback: false  # opt-in guess from read length when metadata and barcodes both fail
  # Manual labels for fasterq-dump's _1, _2, ... files. Keys: SRR, GSM or GSE (most specific wins).
  # A GSE key assumes every GSM has the same file order and fails if the barcodes disagree;
  # use GSM/SRR keys when samples differ. e.g.
  #   read_layout_override:
  #     GSE126321: [R1, R2]
  #     GSM3596322: [I1, R1, R2]
  # Use `read_layout_override: {}` when empty; with entries, drop the `{}` and nest them below (block form).
  read_layout_override: {}

# ======================================================================
# == ENA download (optional pre-processing step) ==
# ======================================================================

# Alternative to geo_download for projects whose reads are in ENA but not in SRA (e.g. GSE118257: SRA SRP178139 has no runs, the reads are in ENA PRJEB39323).
# Downloads the FASTQs submitted to ENA (must be Cell Ranger-named, e.g. <prefix>_S1_L001_R1_001.fastq.gz) and writes a samplesheet.csv compatible with `samples_csv` above.
# Run with: snakemake ena_samplesheet Then point `samples_csv` (above) at the generated <out_location>/ena_download/<project>/samplesheet.csv and run the pipeline as usual.
ena_download:
  # ENA project (PRJEB*/PRJNA*) or study (ERP*/SRP*) accession to download
  project: "PRJEB39323"
  env_metadata: "../envs/pysradb.yaml"  # the scripts only need python 3 (standard library)

